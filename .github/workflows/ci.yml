# CI Elves: тесты скиллов (bun test), типы, документация спеки собирается (--strict), дифф спеки в summary PR;
# на main — публикация docs/spec в ветку spec (в main документации нет). Ветки и PR — параллельно, устаревший прогон PR отменяется;
# прогон main не отменяется и не вытесняется (docs/ci-concurrency.md): группа у него своя — общий ресурс (ветка spec) только
# у spec-publish, очередь — там. Elves — проект с пачками ("batch": true в .agents/elves.json, эпик #645): PR в ветку пачки
# batch/… CI не запускает — его ворота — проверки перед коммитом у исполнителя и github pr premerge (docs/testing.md);
# полный набор (tests) — PR в main, выпуск пачки среди них, и сам main (skills/spec/ci.md, «Batches»).
name: CI

on:
  pull_request:
    branches-ignore: ['batch/**'] # PR в ветку пачки — без прогона: проверки перед коммитом и pr premerge
  push:
    branches: [main] # мерж в ветку пачки тоже ничего не запускает

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Пределы времени (tests/standards/ci-timeouts): у каждой job — с запасом к обычному прогону, у шага, что ставит пакеты
# из сети, — свой; без них GitHub держит зависшую job до 6 часов, а ci-wait агента ждёт её всё это время (#674).
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # обычно 5–6 минут
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # spec-diff: merge-base с origin/main
      - uses: oven-sh/setup-bun@v2
      # Node проекта в тестах под Node (harness-load, spec-harness): Playwright, загрузчик Node для ESLint, node:test;
      # `.ts` без флагов Node грузит с 22.18, а версия Node в образе раннера не задана
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # tests/capabilities/agent-shell запускает Bash-вызов агента в настоящем zsh — оболочке Claude Code на macOS.
      # Зеркало apt раннера зависает без вывода (PR #662 — 20 минут) и бывает медленным, но живым (main после PR #693 —
      # update дольше 40 с): команда — до 120 с, три попытки, шаг — до 8 минут
      - name: zsh
        timeout-minutes: 8
        run: |
          command -v zsh && exit 0
          for attempt in 1 2 3; do
            timeout -k 5 120 sudo apt-get update -qq && timeout -k 5 120 sudo apt-get install -y -qq zsh && exit 0
            echo "::warning::zsh: попытка $attempt — apt-get упал или не уложился в 120 с"
          done
          exit 1
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      - run: bun run typecheck
      - run: bun run spec:doc
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with: { name: docs-spec, path: docs/spec/, retention-days: 1 }
      - name: Дифф спеки в summary
        if: github.event_name == 'pull_request'
        run: bun run spec:diff --base "origin/${{ github.base_ref }}" --report .spec-report.xml --full >> "$GITHUB_STEP_SUMMARY"

  # Токен на запись — только здесь: job не ставит зависимости и не идёт на PR. Публикации — по очереди, не отменяются и не
  # вытесняются (queue: max); прогоны main параллельны, порядок публикаций держит «уже новее» spec-publish — нужна история.
  spec-publish:
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5 # обычно 10 с
    permissions: { contents: write }
    concurrency: { group: spec-publish, queue: max }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with: { name: docs-spec, path: docs/spec }
      - run: bun run spec:publish
