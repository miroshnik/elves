# CI Elves: тесты скиллов (bun test), типы, документация спеки собирается (--strict), дифф спеки в summary PR; docs/spec
# Elves не публикует (#838: спеку читают из дерева tests/). Ветки и PR — параллельно, устаревший прогон PR отменяется;
# прогон main не отменяется и не вытесняется (docs/ci-concurrency.md): группа у него своя, общего ресурса у тестов нет.
# Elves — проект с пачками ("batch": true в .agents/elves.json, эпик #645): PR в ветку пачки
# batch/… CI не запускает — его ворота — проверки перед коммитом у исполнителя и github pr premerge (docs/testing.md);
# полный набор (tests) — PR в main, выпуск пачки среди них, и сам main (skills/spec/ci.md, «Batches»).
name: CI

on:
  pull_request:
    branches-ignore: ['batch/**'] # PR в ветку пачки — без прогона: проверки перед коммитом и pr premerge
  push:
    branches: [main] # мерж в ветку пачки тоже ничего не запускает

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Пределы времени (tests/standards/workflows/ci-timeouts): у каждой job — с запасом к обычному прогону, у шага, что ставит пакеты
# из сети, — свой; без них GitHub держит зависшую job до 6 часов, а ci-wait агента ждёт её всё это время (#674).
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # обычно 5–6 минут
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # spec-diff: merge-base с origin/main
      - uses: oven-sh/setup-bun@v2
      # Node проекта в тестах под Node (harness-load, spec-harness): Playwright, загрузчик Node для ESLint, node:test;
      # `.ts` без флагов Node грузит с 22.18, а версия Node в образе раннера не задана
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # tests/capabilities/elves/agent-shell запускает Bash-вызов агента в настоящем zsh — оболочке Claude Code на macOS.
      # Зеркало apt раннера зависает без вывода (PR #662 — 20 минут) и бывает медленным, но живым (main после PR #693 —
      # update дольше 40 с): команда — до 120 с, три попытки, шаг — до 8 минут
      - name: zsh
        timeout-minutes: 8
        run: |
          command -v zsh && exit 0
          for attempt in 1 2 3; do
            timeout -k 5 120 sudo apt-get update -qq && timeout -k 5 120 sudo apt-get install -y -qq zsh && exit 0
            echo "::warning::zsh: попытка $attempt — apt-get упал или не уложился в 120 с"
          done
          exit 1
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      - run: bun run typecheck
      # Времена файлов тестов (#904): spec:doc идёт в воркерах bun test --parallel, и с --timings воркеры первыми берут
      # самые медленные файлы — иначе файл стеков task-env на 90 с может стартовать последним. Прогон main сохраняет
      # файл после --update-timings под ключом с run_id, PR и main берут последний по префиксу; без файла — порядок
      # не по длительности, прогон не краснеет
      - name: Времена файлов тестов
        uses: actions/cache/restore@v6
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: .test-timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-
      - run: bun run spec:doc
      - name: Сохранить времена файлов тестов
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: .test-timings.json
          key: test-timings-${{ github.run_id }}
      # без --report: ветка spec на origin осталась от прежних публикаций, и база тестов харнесса по ней устарела бы —
      # дифф по исходникам (skills/spec/ci.md, «Publishing the documentation — optional»)
      - name: Дифф спеки в summary
        if: github.event_name == 'pull_request'
        run: bun run spec:diff --base "origin/${{ github.base_ref }}" --full >> "$GITHUB_STEP_SUMMARY"
